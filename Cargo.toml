[package]
name = "agentd"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Truthful local registry and event stream for coding agents"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
